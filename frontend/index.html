<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DataSanitizer</title>
  </head>

  <body>
    <h1>DataSanitizer</h1>

    <!-- PART 1: UPLOAD DATASET -->

    <h3>1. Upload Dataset</h3>

    <input type="file" id="fileInput" accept=".csv,.xlsx" />

    <button onclick="uploadFile()" id="uploadBtn">Upload</button>

    <p id="result"></p>

    <hr />

    <!-- PART 2: CLEAN DATASET -->

    <h3>2. Clean Dataset</h3>

    <label>Missing Values:</label>

    <select id="missing">
      <option value="mean">Mean</option>
      <option value="median" selected>Median</option>
      <option value="mode">Mode</option>
      <option value="drop_rows">Drop Rows</option>
      <option value="drop_columns">Drop Columns</option>
      <option value="interpolation">Interpolation</option>
    </select>

    <br /><br />

    <label>Outlier Detection:</label>

    <select id="outlier">
      <option value="none">None</option>
      <option value="iqr">IQR</option>
      <option value="zscore">Z-Score</option>
    </select>

    <br /><br />

    <label>Encoding:</label>

    <select id="encoding">
      <option value="none">None</option>
      <option value="onehot">One-Hot</option>
      <option value="label">Label Encoding</option>
    </select>

    <br /><br />

    <label>Scaling:</label>

    <select id="scaling">
      <option value="none">None</option>
      <option value="minmax">MinMax</option>
      <option value="standard">Standard</option>
    </select>

    <br /><br />

    <button onclick="cleanData()" id="cleanBtn" disabled>Clean Data</button>

    <p id="cleanResult"></p>

    <hr />

    <!-- PART 3: DOWNLOAD DATASET -->

    <h3>3. Download Dataset</h3>

    <label>Export Format:</label>

    <select id="downloadFormat">
      <option value="csv">CSV</option>
      <option value="json">JSON</option>
    </select>

    <br /><br />

    <button onclick="downloadData()" id="downloadBtn" disabled>Download</button>

    <p id="downloadResult"></p>

    <!-- PART 4: JAVASCRIPT -->

    <script>
      const API_URL = "http://127.0.0.1:8000";

      let currentFileId = null;
      let cleanSucceeded = false;

      // RESET WHEN SELECTING A NEW FILE

      document
        .getElementById("fileInput")
        .addEventListener("change", function () {
          currentFileId = null;
          cleanSucceeded = false;

          document.getElementById("cleanBtn").disabled = true;
          document.getElementById("downloadBtn").disabled = true;

          document.getElementById("result").textContent = "";
          document.getElementById("cleanResult").textContent = "";
          document.getElementById("downloadResult").textContent = "";
        });

      // RESET DOWNLOAD WHEN OPTIONS CHANGE

      ["missing", "outlier", "encoding", "scaling"].forEach(function (id) {
        document.getElementById(id).addEventListener("change", function () {
          cleanSucceeded = false;

          document.getElementById("downloadBtn").disabled = true;

          document.getElementById("cleanResult").textContent = "";

          document.getElementById("downloadResult").textContent = "";
        });
      });

      // FUNCTION 1: UPLOAD FILE

      async function uploadFile() {
        const fileInput = document.getElementById("fileInput");

        const file = fileInput.files[0];

        const result = document.getElementById("result");

        const uploadBtn = document.getElementById("uploadBtn");

        if (!file) {
          alert("Please select a file!");
          return;
        }

        currentFileId = null;
        cleanSucceeded = false;

        document.getElementById("cleanBtn").disabled = true;
        document.getElementById("downloadBtn").disabled = true;

        document.getElementById("cleanResult").textContent = "";
        document.getElementById("downloadResult").textContent = "";

        uploadBtn.disabled = true;

        result.textContent = "Uploading...";

        const formData = new FormData();

        formData.append("file", file);

        try {
          const response = await fetch(API_URL + "/api/upload", {
            method: "POST",
            body: formData,
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(JSON.stringify(data.detail));
          }

          currentFileId = data.file_id;

          result.textContent = "Upload successful! File ID: " + currentFileId;

          document.getElementById("cleanBtn").disabled = false;
        } catch (error) {
          result.textContent = "Upload failed: " + error.message;
        } finally {
          uploadBtn.disabled = false;
        }
      }

      // FUNCTION 2: CLEAN DATASET

      async function cleanData() {
        const result = document.getElementById("cleanResult");

        const cleanBtn = document.getElementById("cleanBtn");

        if (!currentFileId) {
          alert("Please upload a file first!");
          return;
        }

        // GET CLEANING OPTIONS

        const options = {
          file_id: currentFileId,

          missing_method: document.getElementById("missing").value,

          outlier_method: document.getElementById("outlier").value,

          encoding_method: document.getElementById("encoding").value,

          scaling_method: document.getElementById("scaling").value,
        };

        cleanSucceeded = false;

        cleanBtn.disabled = true;

        document.getElementById("downloadBtn").disabled = true;

        document.getElementById("downloadResult").textContent = "";

        result.textContent = "Processing dataset...";

        try {
          const response = await fetch(API_URL + "/api/clean", {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify(options),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(JSON.stringify(data.detail));
          }

          // DISPLAY CLEAN RESULT

          result.textContent =
            "Clean API completed! Output file: " +
            data.processed_data.output_file;

          console.log("Clean Response:", data);

          // ENABLE DOWNLOAD

          cleanSucceeded = true;

          document.getElementById("downloadBtn").disabled = false;
        } catch (error) {
          result.textContent = "Clean failed: " + error.message;
        } finally {
          cleanBtn.disabled = false;
        }
      }

      // FUNCTION 3: DOWNLOAD DATASET

      async function downloadData() {
        const result = document.getElementById("downloadResult");

        const downloadBtn = document.getElementById("downloadBtn");

        // CHECK FILE STATUS

        if (!currentFileId || !cleanSucceeded) {
          alert("Please upload and process a file first!");
          return;
        }

        // GET EXPORT FORMAT

        const format = document.getElementById("downloadFormat").value;

        // CREATE DOWNLOAD URL

        const url =
          API_URL +
          "/api/download/" +
          encodeURIComponent(currentFileId) +
          "?file_format=" +
          encodeURIComponent(format);

        downloadBtn.disabled = true;

        result.textContent = "Downloading...";

        try {
          // SEND GET REQUEST

          const response = await fetch(url);

          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }

          // RECEIVE FILE

          const blob = await response.blob();

          // CREATE TEMPORARY URL

          const downloadUrl = URL.createObjectURL(blob);

          // CREATE DOWNLOAD LINK

          const link = document.createElement("a");

          link.href = downloadUrl;

          link.download = "cleaned_" + currentFileId + "." + format;

          document.body.appendChild(link);

          // START DOWNLOAD

          link.click();

          // REMOVE TEMPORARY LINK

          link.remove();

          // RELEASE MEMORY

          setTimeout(function () {
            URL.revokeObjectURL(downloadUrl);
          }, 1000);

          result.textContent = "Download requested: " + format.toUpperCase();
        } catch (error) {
          result.textContent = "Download failed: " + error.message;
        } finally {
          downloadBtn.disabled = !cleanSucceeded;
        }
      }
    </script>
  </body>
</html>
